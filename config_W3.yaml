data:
  csv_file: data/sp500_prices.csv
  pickle_file: data/portfolio_5stocks.pkl
  tickers:
  - TSLA
  - NFLX
  - AMZN
  - MSFT
  - JNJ
experiment:
  max_iterations: 5
  sample_count: 3
  test_period:
  - '2021-07-01'
  - '2022-06-30'
  train_period:
  - '2020-01-01'
  - '2021-06-30'
  val_period:
  - '2021-07-01'
  - '2022-06-30'
llm:
  provider: bailian
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.7
portfolio:
  default_lambda: 0.5
  transaction_cost: 0.001
  window: 20
ppo:
  actor_lr: 0.0003
  batch_size: 64
  clip_epsilon: 0.2
  critic_lr: 0.0003
  critic_weight_decay: 1.0e-05
  dropout_rate: 0.1
  entropy_coef: 0.01
  epochs_per_update: 5
  gae_lambda: 0.95
  gamma: 0.99
  hidden_dim: 256
  max_episodes: 50
  max_grad_norm: 0.5
  use_twin_critic: true
  value_clip_epsilon: 0.2
pbir:
  enabled: true
  scale: 1.0
  potential_clip: 1.0
  shaping_clip: 0.0
  terminal_zero: true
