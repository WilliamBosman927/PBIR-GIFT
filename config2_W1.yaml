data:
  csv_file: data/portfolio_5stocks2.csv
  pickle_file: data/portfolio_5stocks2.pkl
  tickers: [MSFT, AMZN, JNJ, XOM, CAT]

experiment:
  max_iterations: 5
  sample_count: 3
  train_period: ["2019-01-01", "2020-06-30"]
  val_period: ["2020-07-01", "2021-06-30"]
  test_period: ["2020-07-01", "2021-06-30"]

llm:
  provider: bailian
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.7

portfolio:
  default_lambda: 0.5
  transaction_cost: 0.001
  window: 20

ppo:
  actor_lr: 0.0003
  batch_size: 64
  clip_epsilon: 0.2
  critic_lr: 0.0003
  critic_weight_decay: 1.0e-05
  dropout_rate: 0.1
  entropy_coef: 0.01
  epochs_per_update: 5
  gae_lambda: 0.95
  gamma: 0.99
  hidden_dim: 256
  max_episodes: 50
  max_grad_norm: 0.5
  use_twin_critic: true
  value_clip_epsilon: 0.2
pbir:
  enabled: true
  scale: 1.0
  potential_clip: 1.0
  shaping_clip: 0.0
  terminal_zero: true
